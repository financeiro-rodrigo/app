<body>
<header class="hdr"><button class="menu" data-a="tab" data-k="mais" aria-label="Menu">☰</button><div class="brand"><img class="knot" src="no.png" alt=""><h1>Meu Financeiro</h1><i class="orn"></i></div><img class="logos" src="logos.png" alt="Rodrigo Borges, Psicólogo e psicanalista — Impacto Gestão RH"><span id="sync" class="sync" data-a="syncAgora" style="cursor:pointer">conectando…</span></header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="modal"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const localToday=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fd=d=>d?d.split('-').reverse().join('/'):'';
const monthLabel=m=>{const[y,mo]=m.split('-');return new Date(y,mo-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
const shiftMonth=(m,n)=>{const[y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const daysBetween=(a,b)=>Math.abs((new Date(a)-new Date(b))/864e5);
const cents=n=>Math.round(Math.abs(+n||0)*100);
const norm=s=>String(s||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();

const CATS_OUT=['Casa e clínica','Cartão','Impostos','Juros','Tarifas bancárias','Dívidas e empréstimos','Alimentação','Transporte','Saúde','Educação','Lazer','Outros'];
const CATS_IN=['Atendimentos','Outras receitas'];
const TAX=/RECEITA FEDERAL|\bDAS\b|DARF|SIMPLES NACIONAL|\bIOF\b|IPTU|IPVA|\bISS\b|\bINSS\b/i;
const TARF=/\bTAR\b|TARIFA|ANUIDADE|MANUTEN[CÇ][AÃ]O DE CONTA|PACOTE DE SERVI/i;
const JUR=/JUROS|ENCARGO|\bMORA\b|MULTA|CHEQUE ESPECIAL/i;
const OWN=/RODRIGO\s+G(OMES)?(\s+B(O|OR|ORG|ORGE|ORGES)?)?\s*$|RODRIGO\s+GOMES\s+B|RODRIGO\s+G\s+BORGES|CLINICA PSICOLOGICA RODRIGO|RODRIGOGBORGES|DOUGLAS\s+IGOR\s+MARQ/i;
const autoCat=(desc,dir)=>TAX.test(desc)?'Impostos':JUR.test(desc)?'Juros':(dir!=='in'&&TARF.test(desc))?'Tarifas bancárias':dir==='in'?'Atendimentos':'Outros';

const state={cmode:'falta',finOpen:'',tx:[],cards:[],goals:[],imports:[],config:[],notes:[],modelos:[],csub:'mes',cview:'venc',resOpen:'',catOpen:'',pagasOpen:false,open:new Set(),tab:'resumo',sub:'div',month:localToday().slice(0,7)};

/* ---------- dados: guardados no aparelho e sincronizados com o Google Drive ---------- */
const COLS=['tx','cards','goals','imports','config','notes','modelos'];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('Sem espaço para salvar neste aparelho.')}}};
let STORE=LS.get('mf_store',{});COLS.forEach(c=>{STORE[c]=STORE[c]||{}});
const SET=LS.get('mf_set',{});
const saveSet=()=>LS.set('mf_set',SET);
const TEMAS=[['auto','Verde e ouro (padrão)','#06241a','#e0b23a'],['claro','Claro','#ffffff','#2457c5'],['escuro','Escuro','#12151c','#6b95f0'],['noite','Noite e ouro','#0c1428','#d4a62a'],['lavanda','Lavanda','#f6f2fb','#6b3fb5']];
function aplicarTema(){const t=SET.tema||'auto';if(t==='auto')document.documentElement.removeAttribute('data-tema');else document.documentElement.setAttribute('data-tema',t);const m=document.querySelector('meta[name=theme-color]');const x=TEMAS.find(a=>a[0]===t);if(m&&x)m.setAttribute('content',x[2])}
const persist=()=>LS.set('mf_store',STORE);
function loadState(){COLS.forEach(c=>{state[c]=Object.values(STORE[c]).filter(x=>!x._d)})}
async function save(col,obj){
  if(!obj.id)obj.id=uid();
  const cur=STORE[col][obj.id]||{};
  const n={...cur,...obj,_u:Date.now()};delete n._d;
  STORE[col][obj.id]=n;persist();loadState();agendarSync();
}
async function remove(col,id){STORE[col][id]={id,_d:true,_u:Date.now()};persist();loadState();agendarSync()}
const GSCOPE='https://www.googleapis.com/auth/drive';
let TOKEN=null;const SYNC={busy:false,last:0,err:'',timer:null};
const pastaId=()=>{const l=SET.pasta||'';return(l.match(/folders\/([\w-]{15,})/)||l.match(/[?&]id=([\w-]{15,})/)||l.match(/^([\w-]{20,})$/)||[])[1]||null};
const syncPronto=()=>!!(SET.clientId&&pastaId());
function carregarGoogle(){
  if(window.google&&google.accounts&&google.accounts.oauth2)return Promise.resolve();
  if(carregarGoogle.p)return carregarGoogle.p;
  carregarGoogle.p=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>ok();s.onerror=()=>{carregarGoogle.p=null;no(new Error('sem internet'))};document.head.appendChild(s)});
  return carregarGoogle.p;
}
function pedirToken(){
  return new Promise((ok,no)=>{
    if(TOKEN&&TOKEN.exp>Date.now()+60000)return ok(TOKEN.v);
    if(!SET.clientId)return no(new Error('Falta a chave do Google'));
    carregarGoogle().then(()=>{
      const c=google.accounts.oauth2.initTokenClient({client_id:SET.clientId.trim(),scope:GSCOPE,
        callback:r=>{if(r.error||!r.access_token)return no(new Error(r.error||'recusado'));TOKEN={v:r.access_token,exp:Date.now()+(+r.expires_in||3600)*1000};LS.set('mf_gconn',1);ok(TOKEN.v)},
        error_callback:e=>no(new Error((e&&e.type)||'cancelado'))});
      c.requestAccessToken({prompt:LS.get('mf_gconn',0)?'':'consent'});
    }).catch(no);
  });
}
async function gfetch(url,opt,tk){
  const r=await fetch(url,{...opt,headers:{...(opt&&opt.headers),Authorization:'Bearer '+tk}});
  if(r.status===401){TOKEN=null;throw new Error('Sessão do Google expirou. Toque em sincronizar.')}
  if(r.status===403||r.status===404)throw new Error('Sem acesso à pasta do Drive ('+r.status+'). Confira se ela foi compartilhada com você.');
  if(!r.ok)throw new Error('Drive '+r.status);
  return r;
}
async function acharArq(tk,nome){
  const q=encodeURIComponent(`name='${nome}' and '${pastaId()}' in parents and trashed=false`);
  const j=await(await gfetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&pageSize=5&supportsAllDrives=true&includeItemsFromAllDrives=true`,{},tk)).json();
  return(j.files||[])[0]||null;
}
const baixarArq=async(tk,id)=>(await gfetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media&supportsAllDrives=true`,{},tk)).text();
async function criarArq(tk,nome,texto){
  const b='mfb'+Date.now();
  const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:nome,parents:[pastaId()],mimeType:'application/json'})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${texto}\r\n--${b}--`;
  await gfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&supportsAllDrives=true&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body},tk);
}
const atualizarArq=(tk,id,texto)=>gfetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media&supportsAllDrives=true`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:texto},tk);
function mesclar(remoto){
  let mudou=false,subir=false;
  const rc=(remoto&&remoto.cols)||{};
  COLS.forEach(c=>{
    const R=rc[c]||{},L=STORE[c];
    Object.keys(R).forEach(id=>{const r=R[id],l=L[id];if(!l||(r._u||0)>(l._u||0)){L[id]=r;mudou=true}});
    Object.keys(L).forEach(id=>{const r=R[id];if(!r||(L[id]._u||0)>(r._u||0))subir=true});
  });
  return{mudou,subir};
}
async function syncCofre(tk){

async function syncNow(interativo){

      const m=t.match(new RegExp('const APP_'+'VER=\'([^\']+)\''));

        b.innerHTML='<span>Nova versão disponível.</span><span style="display:flex;gap:8px"><button id="avAtu" style="background:#d4af37;color:#000;border:0;border-radius:8px;padding:8px 14px;font-weight:700">Atualizar</button><button id="avFecha" style="background:transparent;color:#fff;border:1px solid #fff5;border-radius:8px;padding:8px 12px">✕</button></span>';
        b.querySelector('#avAtu').onclick=()=>{location.reload()};
        b.querySelector('#avFecha').onclick=()=>{b.remove()};
        document.body.appendChild(b);
      }
    }catch(e){}
  }
  setTimeout(checarVersao,4000);
  setInterval(checarVersao,600000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checarVersao()});
  if(syncPronto()&&LS.get('mf_gconn',0))syncNow(false);

}

  const saiu=t=>t.kind==='out'&&t.status==='pago'&&t.origin!=='conta'&&t.origin!=='cartao';

}

  const soma=X=>X.reduce((a,t)=>a+(+t.amount||0),0);
  const ord=X=>[...X].sort((a,b)=>b.date.localeCompare(a.date));
  const transf=L.filter(t=>t.kind==='transfer');
  const notaTr=transf.length?`<p class="note">${transf.length} transferência(s) entre contas próprias (${brl(soma(transf))}) ficam de fora desta soma.</p>`:'';
  let corpo='';
  if(k==='ent'||k==='sai'){
    const X=L.filter(t=>t.kind===(k==='ent'?'in':'out')&&t.status==='pago'&&(k==='ent'||(t.origin!=='conta'&&t.origin!=='cartao')));
    const de=X.filter(t=>t.origin==='extrato'),dm=X.filter(t=>t.origin!=='extrato');
    const sec=(tit,expl,Y)=>Y.length?`<div style="margin-top:10px"><b>${tit} — ${brl(soma(Y))}</b><div class="note">${expl}</div>${ord(Y).map(t=>mov(t,k==='ent'?'in':'out')).join('')}</div>`:'';
    const pagas=k==='sai'?L.filter(t=>t.kind==='out'&&t.status==='pago'&&(t.origin==='conta'||t.origin==='cartao')):[];
    corpo=`<b>${k==='ent'?'Total que entrou':'Total que saiu'}: ${brl(soma(X))}</b><p class="note">${k==='sai'?'Conta só o que aparece nos <b>extratos do banco</b> (e o que você lançou à mão). As contas a pagar e as faturas ficam na aba Contas e não somam aqui, para nada ser contado duas vezes.':'Entradas lidas dos extratos do banco e lançadas à mão.'}</p>`+
      sec(k==='sai'?'Saídas do extrato do banco':'Entradas do extrato do banco',`${de.length} lançamento(s) lidos dos extratos.`,de)+
      sec('Lançados à mão',`${dm.length} lançamento(s) feitos por você.`,dm)+
      (pagas.length?`<p class="note" style="margin-top:12px">Fora desta soma: ${pagas.length} conta(s)/fatura(s) marcadas como pagas na aba Contas (${brl(soma(pagas))}).</p>`:'')+
      (!X.length?'<p class="note">Nada neste mês.</p>':'')+notaTr;
  }else if(k==='pen'){
    const X=L.filter(t=>t.kind==='out'&&t.status==='pendente').sort((a,b)=>a.date.localeCompare(b.date));
    corpo=`<b>Ainda falta pagar — ${brl(soma(X))}</b>${X.map(t=>mov(t,'pend')).join('')||'<p class="note">Tudo pago. 🎉</p>'}`;
  }else{
    corpo=`<b>Como chegou nesse saldo</b><div class="row"><div class="rl"><b>Entrou</b></div><div class="rr in">+ ${brl(s.ent)}</div></div><div class="row"><div class="rl"><b>Saiu</b></div><div class="rr out">− ${brl(s.sai)}</div></div><div class="row"><div class="rl"><b>Saldo até agora</b></div><div class="rr ${s.saldo<0?'out':'in'}">${brl(s.saldo)}</div></div><div class="row"><div class="rl"><b>Ainda falta pagar</b></div><div class="rr pend">− ${brl(s.pen)}</div></div><div class="row"><div class="rl"><b>Se pagar tudo que falta</b></div><div class="rr ${s.saldo-s.pen<0?'out':'in'}">${brl(s.saldo-s.pen)}</div></div>`;
  }
  return`<div class="card">${corpo}</div>`;
}

function vContasMes(){
  const L=contasDoMes();
  const S=f=>L.filter(f).reduce((a,t)=>a+(+t.amount||0),0);
  const tot=S(()=>true),pg=S(t=>t.status==='pago');
  const faltam=state.modelos.filter(m=>m.ativo!==false&&!L.some(t=>t.modeloId===m.id)).length;
  const pend=L.filter(t=>t.status!=='pago').sort((a,b)=>a.date.localeCompare(b.date)||a.desc.localeCompare(b.desc));
  const pagas=L.filter(t=>t.status==='pago').sort((a,b)=>(b.paidDate||'').localeCompare(a.paidDate||''));
  const v=state.cview,mode=state.cmode||'falta';
  const todas=[...L].sort((a,b)=>a.date.localeCompare(b.date)||a.desc.localeCompare(b.desc));
  const base=mode==='pago'?pagas:mode==='total'?todas:pend;
  const titulo={falta:'Falta pagar',pago:'Já pago',total:'Todas as contas do mês'}[mode];
  const vazio={falta:'Tudo pago neste mês. 🎉',pago:'Nenhuma conta paga ainda neste mês.',total:'Nenhuma conta neste mês.'}[mode];
  const sel=`<div class="tabs">${[['venc','Vencimento'],['tipo','Tipo'],['pessoa','Pessoa']].map(([k,n])=>`<button class="${v===k?'on':''}" data-a="cview" data-k="${k}">${n}</button>`).join('')}</div>`;
  let corpo='';
  if(v==='venc'){corpo=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${titulo}</b><span class="note">${base.length} conta(s)</span></div>${base.map(contaRow).join('')||`<p class="note">${vazio}</p>`}</div>`}
  else{
    const key=t=>v==='tipo'?(t.grupo||'Outros'):(t.dono||'Casa');
    const ordem=v==='tipo'?GRUPOS:DONOS;
    const chaves=[...new Set([...ordem,...base.map(key)])];
    corpo=chaves.map(g=>{const X=base.filter(t=>key(t)===g);if(!X.length)return'';
      const f=X.reduce((a,t)=>a+(+t.amount||0),0);
      return`<div class="card"><div style="display:flex;justify-content:space-between"><b>${esc(g)}</b><span class="note">${mode==='falta'?'falta ':mode==='pago'?'pago ':'total '}${brl(f)}</span></div>${X.map(contaRow).join('')}</div>`}).join('')||`<div class="card"><p class="note">${vazio}</p></div>`;
  }
  const tile=(k,rot,val,cls,nota)=>`<div class="card" data-a="cmode" data-k="${k}" style="cursor:pointer;${mode===k?'border-color:var(--pri);box-shadow:0 0 0 1px var(--pri) inset':''}"><div class="k">${rot} ${mode===k?'▼':'▸'}</div><div class="v ${cls}">${val}</div><div class="note">${nota}</div></div>`;
  const to=ME?outroDe(ME):'';
  return monthNav()+`<div class="grid">${tile('total','Total de contas do mês',brl(tot),'','toque para ver todas')}${tile('pago','Já pago',brl(pg),'in','toque para ver as pagas')}</div>
  ${tile('falta','Falta pagar',brl(tot-pg),'pend','toque para ver as que faltam')}
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0">${faltam?`<button class="b" data-a="gerar">Criar ${faltam} conta(s) fixa(s) do mês</button>`:''}<label class="b g">Ler conta (PDF)<input type="file" accept="application/pdf,.pdf" data-a="conta" hidden></label><label class="b g">Ler conta (foto)<input type="file" accept="image/*" data-a="conta" hidden></label><label class="b g">Planilha (Excel/CSV)<input type="file" accept=".xlsx,.xls,.csv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" data-a="planilha" hidden></label><button class="b g" data-a="new" data-kind="out" data-pend="1">+ Manual</button><a class="s wa" href="${waUrl(textoResumo(),to)}" target="_blank" rel="noopener" style="padding:10px 12px">Enviar resumo no WhatsApp</a></div>
  ${sel}${corpo}`;
}

/* diagnóstico de duplicatas — nunca apaga sozinho */
function dupGroups(){
  const g={};
  state.tx.filter(t=>t.origin==='extrato').forEach(t=>{const k=[t.bank,t.date,t.dir||t.kind,cents(t.amount)].join('|');(g[k]=g[k]||[]).push(t)});
  const out=[];
  Object.entries(g).forEach(([k,arr])=>{
    if(arr.length<2)return;
    const per={};arr.forEach(t=>per[t.importId||'?']=(per[t.importId||'?']||0)+1);
    const legit=Math.max(...Object.values(per));
    const extra=arr.length-legit;
    if(extra<=0)return;
    const sorted=[...arr].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
    out.push({k,arr:sorted,extra,toRemove:sorted.slice(0,extra)});
  });
  return out;
}

  const G=dupGroups();

  const eIn=G.reduce((a,g)=>a+g.toRemove.filter(t=>(t.dir||t.kind)==='in').reduce((x,t)=>x+t.amount,0),0);
  const eOut=G.reduce((a,g)=>a+g.toRemove.filter(t=>(t.dir||t.kind)==='out').reduce((x,t)=>x+t.amount,0),0);
  return`<div class="card"><b>Possíveis duplicatas</b>

/* ---------- leitura de arquivos pelo Claude ---------- */
async function loadPdfJs(){
  if(window.pdfjsLib)return;
  const fontes=[['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'],['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js']];
  let ok=false;
  for(const [js,wk] of fontes){
    try{await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=js;sc.onload=res;sc.onerror=()=>rej(new Error('script'));document.head.appendChild(sc)});pdfjsLib.GlobalWorkerOptions.workerSrc=wk;ok=true;break}catch(e){}
  }
  if(!ok)throw new Error('Não consegui carregar o leitor de PDF (internet?)');
}
async function fileContent(file){
  if(file.type.startsWith('image/'))return{text:'',images:[file]};
  await loadPdfJs();
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  let text='';
  for(let p=1;p<=pdf.numPages;p++){
    const c=await(await pdf.getPage(p)).getTextContent();let y=null;
    c.items.forEach(i=>{const yy=i.transform[5];if(y!==null&&Math.abs(yy-y)>2)text+='\n';text+=i.str+' ';y=yy});
    text+='\n';
  }
  if(text.replace(/\s/g,'').length>80)return{text:text.slice(0,70000),images:[]};
  /* PDF feito de imagens: desenha cada página em alta resolução (largura 1600 px) e corta em faixas de até ~700 px de altura,
     sempre num espaço em branco entre linhas. Assim a IA vê cada faixa sem reduzir a imagem e lê os números com nitidez. */
  const images=[];
  for(let p=1;p<=Math.min(pdf.numPages,12);p++){
    const pg=await pdf.getPage(p),base=pg.getViewport({scale:1}),vp=pg.getViewport({scale:Math.min(3,1600/base.width)}),cv=document.createElement('canvas');
    cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
    const cx=cv.getContext('2d');await pg.render({canvasContext:cx,viewport:vp}).promise;
    const W=cv.width,H=cv.height,px=cx.getImageData(0,0,W,H).data;
    const tinta=y=>{let n=0;for(let x=0;x<W;x+=3){const i=(y*W+x)*4;if(px[i]+px[i+1]+px[i+2]<540)n++}return n};
    const cortes=[0];
    while(H-cortes[cortes.length-1]>800){
      const alvo=cortes[cortes.length-1]+700;let melhor=alvo,min=1e9;
      for(let y=alvo-130;y<=alvo+60&&y<H-1;y++){const t=tinta(y);if(t<min){min=t;melhor=y;if(t===0)break}}
      cortes.push(melhor);
    }
    cortes.push(H);
    for(let k=0;k<cortes.length-1;k++){
      const h=cortes[k+1]-cortes[k];if(h<30)continue;
      const c2=document.createElement('canvas');c2.width=W;c2.height=h;c2.getContext('2d').drawImage(cv,0,cortes[k],W,h,0,0,W,h);
      images.push(await new Promise(r=>c2.toBlob(r,'image/png')));
    }
  }
  return{text:'',images};
}
const blobUrl=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(b)});

function parseCsv(txt){
  txt=txt.replace(/^﻿/,'');const sep=(txt.split('\n')[0].match(/;/g)||[]).length>=(txt.split('\n')[0].match(/,/g)||[]).length?';':',';
  const R=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===sep){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))R.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(x=>x.trim()))R.push(row);return R;
}

/* Confere cada valor lido com a coluna Saldo do extrato: saldo desta linha − saldo da linha anterior no tempo = valor com sinal.
   Quando a conta não fecha, o valor é corrigido pelo saldo (só se as linhas vizinhas fecham, para o erro não estar no saldo) ou a linha recebe um aviso. */
function conferirSaldos(rows){
  const com=rows.filter(r=>r.saldo!=null).length;
  if(rows.length<2||com<rows.length*0.6)return 0;
  const asc=rows[0].date<rows[rows.length-1].date;
  const velha=i=>asc?rows[i-1]:rows[i+1], nova=i=>asc?rows[i+1]:rows[i-1];
  const efeito=r=>(r.dir==='in'?1:-1)*cents(r.amount);
  const dif=i=>{const r=rows[i],o=velha(i);return(r&&o&&r.saldo!=null&&o.saldo!=null)?Math.round((r.saldo-o.saldo)*100):null};
  const ok=i=>{const d=dif(i);return d===null?null:d===efeito(rows[i])};
  const falhas=[];for(let i=0;i<rows.length;i++)if(ok(i)===false)falhas.push(i);
  let n=0;
  for(const i of falhas){
    const r=rows[i],d=dif(i),vizNova=nova(i)?ok(asc?i+1:i-1):null,vizVelha=velha(i)?ok(asc?i-1:i+1):null;
    const saldoConfiavel=vizNova!==false&&vizVelha!==false;
    if(d!==0&&saldoConfiavel&&(d>0)===(r.dir==='in')){r.lido=r.amount;r.amount=Math.abs(d)/100;r.corrigido=true;n++}
    else r.aviso=true;
  }
  return n;
}

/* Une o mesmo pagamento que aparece em dois lugares: na conta (planilha) e no extrato. Só a conta conta nos totais. */
async function unir(billId,extId){

  await save('tx',{id:e.id,absorbedBy:b.id});

}
const _contasLivres=()=>state.tx.filter(t=>t.kind==='out'&&t.origin==='conta'&&!t._d&&!t.matched&&cents(t.amount)>0);
const _extLivres=()=>state.tx.filter(t=>t.origin==='extrato'&&t.kind==='out'&&!t.absorbedBy).sort((a,b)=>a.date.localeCompare(b.date));
async function reconciliar(){
  const usadas=new Set(),pares=[];
  for(const [tolC,maxD] of [[0,7]]){   /* só une sozinho quando o valor é exatamente igual; os quase iguais viram sugestão para você confirmar */
    for(const e of _extLivres()){
      let best=null,bs=1e9;
      _contasLivres().forEach(b=>{if(usadas.has(b.id))return;const df=Math.abs(cents(b.amount)-cents(e.amount));if(df>tolC||(tolC&&df===0))return;const d=daysBetween(b.paidDate||b.date,e.date);if(d>maxD)return;const sc=df+d;if(sc<bs){best=b;bs=sc}});
      if(best){usadas.add(best.id);pares.push([best,e]);await unir(best.id,e.id)}
    }
  }
  return pares;
}
function sugestoes(){
  const out=[];const usadasE=new Set();
  _contasLivres().filter(b=>b.status==='pago').forEach(b=>{
    let best=null,bs=1e9;
    _extLivres().forEach(e=>{if(usadasE.has(e.id))return;const df=Math.abs(cents(b.amount)-cents(e.amount));const d=daysBetween(b.paidDate||b.date,e.date);if(d>7||df>Math.max(500,cents(b.amount)*0.03))return;const sc=df/100+d;if(sc<bs){best=e;bs=sc}});
    if(best){usadasE.add(best.id);out.push([b,best])}
  });
  return out;
}
async function desfazerImport(id){
  const itens=state.tx.filter(t=>t.importId===id);
  for(const t of itens){
    if(t.absorbedBy){const b=state.tx.find(x=>x.id===t.absorbedBy);if(b&&b.matched){const volta=b.autoQuitada||!b.paidDate;await save('tx',{id:b.id,matched:false,autoQuitada:false,status:volta?'pendente':b.status,paidDate:volta?'':b.paidDate})}}
    await remove('tx',t.id);
  }
  await remove('imports',id);
}

/* ---------- cofre: criptografado no aparelho (AES-GCM + senha mestra); o servidor só guarda texto cifrado, em área privada de cada pessoa ---------- */
const VAULT={status:'loading',started:false,doc:null,raw:null,key:null,salt:null,items:[],show:new Set()};
let lockTimer=null;
const b64=u=>{let s='';new Uint8Array(u).forEach(b=>s+=String.fromCharCode(b));return btoa(s)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function vaultSave(){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},VAULT.key,new TextEncoder().encode(JSON.stringify(VAULT.items)));
  const obj={v:1,salt:b64(VAULT.salt),iv:b64(iv),ct:b64(ct),updatedAt:new Date().toISOString()};
  await VAULT.doc.set(obj);VAULT.raw=obj;
}
function lockVault(){if(VAULT.status==='open'){VAULT.key=null;VAULT.items=[];VAULT.show=new Set();VAULT.status='locked'}clearTimeout(lockTimer)}
function resetLock(){clearTimeout(lockTimer);if(VAULT.status==='open')lockTimer=setTimeout(()=>{lockVault();render();toast('Cofre bloqueado por inatividade')},120000)}
async function vaultLoad(){
  try{
    if(!ME||!window.crypto||!crypto.subtle){VAULT.status='na';return render()}
    if(syncPronto()&&LS.get('mf_gconn',0))await syncNow(false);
    VAULT.doc={get:async()=>{const d=LS.get('mf_vault_'+ME,null);return{exists:!!d,data:()=>d}},set:async o=>{LS.set('mf_vault_'+ME,o);agendarSync()}};
    const snap=await VAULT.doc.get();const d=snap.data();
    VAULT.raw=d&&d.ct?d:null;VAULT.status=VAULT.raw?'locked':'none';
  }catch(e){VAULT.status='na'}
  render();
}
function vCofre(){
  if(!VAULT.started){VAULT.started=true;vaultLoad()}
  const st=VAULT.status;
  if(st==='loading')return'<p class="note">Carregando…</p>';
  if(st==='na')return'<div class="alert">Para usar o cofre, escolha antes quem você é neste aparelho (aba Recados ou Mais › Configurações).</div>';
  if(st==='none')return`<div class="card"><b>Criar seu cofre</b>
  <p class="note">Crie uma senha mestra. Ela criptografa tudo antes de sair do aparelho. <b>Se você esquecer, não há como recuperar.</b> Só você abre o seu cofre; o do Douglas é separado, com a senha dele.</p>
  <label class="f">Senha mestra (mínimo 8 caracteres)</label><input id="vPass" type="password" autocomplete="new-password">
  <label class="f">Repita a senha</label><input id="vPass2" type="password" autocomplete="new-password">
  <button class="b" data-a="vCreate">Criar cofre</button></div>`;
  if(st==='locked')return`<div class="card"><b>🔒 Cofre bloqueado</b>
  <label class="f">Senha mestra</label><input id="vPass" type="password" autocomplete="current-password">
  <button class="b" data-a="vUnlock">Abrir</button></div>`;
  const tipos=['Banco','Cartão','Outro'];
  return`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="b" data-a="vNew">+ Novo item</button><button class="b g" data-a="vLock">Bloquear agora</button></div>
  <p class="note">Bloqueia sozinho após 2 minutos parado. Não guarde o código de segurança (CVV) dos cartões.</p>`+
  tipos.map(tp=>{const L=VAULT.items.filter(i=>i.tipo===tp);if(!L.length)return'';
    return`<div class="card"><b>${tp==='Banco'?'Bancos':tp==='Cartão'?'Cartões':'Outros'}</b>${L.map(i=>`<div class="row"><div class="rl"><b>${esc(i.nome)}</b><small>${i.usuario?'Login: '+esc(i.usuario)+'<br>':''}Senha: ${VAULT.show.has(i.id)?esc(i.senha):'••••••••'}${i.notas?'<br>'+esc(i.notas):''}</small></div>
    <div class="rr"><button class="s" data-a="vShow" data-id="${i.id}">${VAULT.show.has(i.id)?'Ocultar':'Mostrar'}</button><button class="s" data-a="vCopy" data-id="${i.id}">Copiar senha</button><button class="s" data-a="vEdit" data-id="${i.id}">Editar</button><button class="s d" data-a="vDel" data-id="${i.id}">Excluir</button></div></div>`).join('')}</div>`}).join('')||'<p class="note">Cofre vazio. Toque em + Novo item.</p>';
}

    for(const m of state.modelos.filter(m=>m.ativo!==false)){if(L.some(t=>t.modeloId===m.id))continue;
      await save('tx',{kind:'out',desc:m.nome,amount:+m.valor||0,date:dueDate(state.month,m.dia),status:'pendente',category:catDoGrupo(m.grupo),grupo:m.grupo,dono:m.dono,modeloId:m.id,cardId:m.cardId||null,origin:'conta',avisado:false,createdAt:new Date().toISOString()});n++}
    toast(n?n+' conta(s) criada(s)':'Nada a criar');render()},
  newModelo:()=>modeloForm({}),
  editModelo:d=>modeloForm(state.modelos.find(m=>m.id===d.id)),
  toggleModelo:async d=>{const m=state.modelos.find(x=>x.id===d.id);await save('modelos',{id:m.id,ativo:m.ativo===false});render()},
  delModelo:d=>confirmBox('Excluir esta conta fixa? As contas já criadas nos meses continuam.',async()=>{await remove('modelos',d.id);render()}),
  newGoal:()=>{modal(`<h3>Nova meta</h3><label class="f">Nome</label><input id="gN"><label class="f">Valor da meta</label><input id="gT" inputmode="decimal"><button class="b" id="gS">Salvar</button> <button class="b g" data-a="close">Cancelar</button>`);
    $('#gS').onclick=async()=>{if(!$('#gN').value.trim())return;await save('goals',{name:$('#gN').value.trim(),target:num($('#gT').value)||0,saved:0});closeModal();render()}},
  addGoal:d=>{modal(`<h3>Aporte</h3><label class="f">Valor</label><input id="aV" inputmode="decimal"><button class="b" id="aS">Salvar</button> <button class="b g" data-a="close">Cancelar</button>`);
    $('#aS').onclick=async()=>{const g=state.goals.find(x=>x.id===d.id);await save('goals',{id:g.id,saved:(g.saved||0)+(num($('#aV').value)||0)});closeModal();render()}},
  delGoal:d=>confirmBox('Excluir esta meta?',async()=>{await remove('goals',d.id);render()}),
  dedupe:d=>{const g=dupGroups()[+d.i];if(!g)return;
    confirmBox(`Remover ${g.extra} registro(s) excedente(s) de ${esc(g.arr[0].bank)} em ${fd(g.arr[0].date)}, ${brl(g.arr[0].amount)}? Ficam os mais antigos.`,async()=>{for(const t of g.toRemove)await remove('tx',t.id);render()})},
  conferir:async()=>{
    modal('<h3>Conferindo…</h3>');const p=await reconciliar();render();
    const sg=sugestoes();
    modal('<h3>🔍 Conferência de duplicidades</h3>'+
    (p.length?`<p>✅ <b>${p.length}</b> pagamento(s) estavam contados <b>duas vezes</b> (na conta e no extrato) e agora contam só uma:</p><div style="max-height:30vh;overflow:auto">${p.map(([b,e])=>`<div class="row"><div class="rl"><b>${esc(b.desc)}</b><small>extrato: ${esc(e.desc)} · ${fd(e.date).slice(0,5)}</small></div><div class="rr out">${brl(b.amount)}</div></div>`).join('')}</div>`:'<p>✅ Nenhuma repetição exata encontrada.</p>')+
    (sg.length?`<p style="margin-top:12px">🤔 <b>${sg.length}</b> possível(is) repetição(ões) com valor <b>quase igual</b>. Se for o mesmo pagamento, toque em <b>Unir</b>:</p><div style="max-height:40vh;overflow:auto">${sg.map(([b,e])=>`<div class="row" style="display:block"><div><b>Conta:</b> ${esc(b.desc)} — ${brl(b.amount)} (${fd(b.paidDate||b.date).slice(0,5)})</div><div><b>Extrato:</b> ${esc(e.desc)} — ${brl(e.amount)} (${fd(e.date).slice(0,5)})</div><button class="s" data-a="unir" data-b="${b.id}" data-e="${e.id}">Unir (é o mesmo)</button></div>`).join('')}</div>`:'')+
    '<br><button class="b" data-a="close">Fechar</button>');
  },
  unir:async d=>{await unir(d.b,d.e);render();A.conferir()},
  desfazImp:d=>confirmBox('Desfazer esta importação? Os lançamentos dela saem do app, e as contas que ela quitou voltam a pendentes. Depois você pode importar o PDF de novo.',async()=>{await desfazerImport(d.id);render();toast('Importação desfeita')}),
  finTog:d=>{state.finOpen=state.finOpen===d.k?'':d.k;render()},
  cmode:d=>{state.cmode=d.k;render()},
  verResumo:()=>{closeModal();state.tab='resumo';if(window._impMes)state.month=window._impMes;render()},
  own:d=>{window._imp.rows[+d.i].own=d.checked},
  imp:d=>{window._imp.rows[+d.i].skip=!d.checked;updImpCount()},
  impAll:d=>{const on=d.checked;window._imp.rows.forEach(r=>{if(r.isNew)r.skip=!on});document.querySelectorAll('input[data-a="imp"]').forEach(c=>{c.checked=on});updImpCount()},
};
document.addEventListener('click',e=>{resetLock();const t=e.target.closest('[data-a]');if(!t||t.tagName==='INPUT')return;if(t.tagName==='A')e.preventDefault();const f=A[t.dataset.a];if(f)f(t.dataset)});
document.addEventListener('change',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.a)return;
  if(t.dataset.a==='own')A.own({i:t.dataset.i,checked:t.checked});
  if(t.dataset.a==='imp')A.imp({i:t.dataset.i,checked:t.checked});
  if(t.dataset.a==='impVal'){const r=window._imp.rows[+t.dataset.i];const v=Math.abs(+String(t.value).replace(',','.'));if(v){r.amount=v;r.aviso=false;r.skip=false;r.editado=true;const cb=document.querySelector('[data-a="imp"][data-i="'+t.dataset.i+'"]');if(cb)cb.checked=true;updImpCount();toast('Valor ajustado e linha marcada.');}}
  if(t.dataset.a==='impAll')A.impAll({checked:t.checked});
  if(t.type==='file'&&t.files[0]){const f=t.files[0];const k=t.dataset.a;t.value='';if(k==='conta')readConta(f);if(k==='extrato')readExtrato(f);if(k==='cartoesPdf')readCartoes(f);if(k==='planilha'){window._plBancoSel=null;importarPlanilha(f)}if(k==='planilhaExt'){window._plBancoSel=($('#impBankNew').value.trim()||$('#impBank').value);importarPlanilha(f)}if(k==='backup'){f.text().then(importarBackup).catch(()=>toast('Arquivo inválido'))}}
});
boot();
</script>
</body>
</html>
